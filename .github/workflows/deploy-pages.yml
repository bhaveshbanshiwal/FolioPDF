name: Deploy FolioPDF to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build static site
        run: npm run build
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any legacy branch Pages build to finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking if GitHub's legacy branch-based 'pages build and deployment' is racing this commit..."
          for i in $(seq 1 20); do
            ACTIVE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
              | node -e "
                const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                const runs = (d.workflow_runs || []).filter(r =>
                  (r.path === 'dynamic/pages/pages-build-deployment' || r.name === 'pages build and deployment') &&
                  r.status !== 'completed'
                );
                console.log(runs.length);
              " 2>/dev/null || echo "0")
            if [ "$ACTIVE" = "0" ]; then
              break
            fi
            echo "Legacy pages-build-deployment still running ($ACTIVE); waiting 3s..."
            sleep 3
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
